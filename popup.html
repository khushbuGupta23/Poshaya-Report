<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; font: 13px system-ui, sans-serif; margin: 12px; }
    input, select, button { width: 100%; padding: 6px; margin: 4px 0; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    td, th { border-bottom: 1px solid #ddd; padding: 4px; text-align: left; }
    #status { color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <button id="login">Sign in with Zoho</button>
  <input id="orgId" placeholder="Organization ID">
  <select id="module">
    <option value="items">Items</option>
    <option value="invoices">Invoices</option>
    <option value="contacts">Contacts</option>
  </select>
  <button id="fetch">Fetch</button>
  <button id="report">📊 Open Sales &amp; Stock Report</button>
  <div id="status"></div>
  <table id="out"></table>
  <script src="popup.js"></script>
</body>
</html>
